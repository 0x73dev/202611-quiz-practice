<title>ISTA Senior Science Quiz 2026 – Predicted Questions</title>

<style>
  :root{
    --bg:#f6f5f1; --card:#fff; --ink:#1c1c1a; --muted:#6b6a64; --line:#e4e2db;
    --accent:#1f6f5c; --accent-soft:#e3f1ec; --ans:#0f4f40;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151513; --card:#1e1e1b; --ink:#ecebe6; --muted:#9a998f; --line:#2f2e2a;
      --accent:#5cc3a6; --accent-soft:#1d322b; --ans:#9fe3cf; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.5rem;line-height:1.25;margin:8px 0 4px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px;position:sticky;top:0;
    background:var(--bg);padding:8px 0;z-index:2}
  button.ctl{border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:8px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
  button.ctl.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .score{margin-left:auto;align-self:center;font-size:.9rem;color:var(--muted)}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 14px 6px;margin:0 0 16px}
  section h2{font-size:1.05rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .tag{font-size:.72rem;background:var(--accent-soft);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-weight:600}
  .note{color:var(--muted);font-size:.85rem;margin:0 0 8px}
  ol{margin:0;padding-left:1.4em}
  li{padding:10px 0;border-top:1px solid var(--line)}
  li:first-child{border-top:none}
  .q{display:block}
  .a{margin-top:6px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
  .reveal{border:1px dashed var(--accent);background:transparent;color:var(--accent);
    border-radius:8px;padding:4px 10px;font:inherit;font-size:.85rem;cursor:pointer}
  .ans{display:none;color:var(--ans);font-weight:600}
  li.open .ans{display:inline}
  li.open .reveal{display:none}
  .mark{display:none;gap:6px}
  li.open .mark{display:inline-flex}
  .mark button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;
    padding:2px 8px;font-size:.8rem;cursor:pointer}
  li.right .mark .ok{background:#2e8b57;color:#fff;border-color:#2e8b57}
  li.wrong .mark .no{background:#b5473a;color:#fff;border-color:#b5473a}
  .pattern ul{margin:4px 0 10px;padding-left:1.2em}
  .pattern li{border:none;padding:3px 0}
  .sources{font-size:.85rem;color:var(--muted)}
  .sources a{color:var(--accent)}
  .ctx{font-weight:400;color:var(--muted);font-size:.85rem;display:block;margin-top:2px}
  .picgrid{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .picgrid li{border:1px solid var(--line);border-radius:12px;padding:8px;border-top:1px solid var(--line)}
  .picgrid li:first-child{border-top:1px solid var(--line)}
  .picgrid svg{width:100%;height:auto;display:block;border-radius:8px;margin-top:4px}
  .cat{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}

  .prob{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;margin-bottom:4px}
  .p3{background:#fde2e1;color:#a3261d}.p2{background:#fff1cc;color:#8a5a00}.p1{background:#e6eef7;color:#3b5a7a}
  @media (prefers-color-scheme: dark){.p3{background:#4a1f1c;color:#ffb3ab}.p2{background:#42330c;color:#ffd77a}.p1{background:#1f2c3a;color:#a9c6e4}}
  li.hidden{display:none}

  /* ---- flashcard mode ---- */
  .fc{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:50;background:var(--bg);color:var(--ink);
    display:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
  .fc.open{display:block}
  .fc-in{width:100%;max-width:720px;height:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0}
  .fc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}
  .fc-prog{margin-left:auto;color:var(--muted);font-size:.85rem;text-align:right}
  .fc-opt{font-size:.9rem;color:var(--ink);display:inline-flex;gap:8px;align-items:center;cursor:pointer}
  .fc.setup .fc-play,.fc.setup .fc-play-top{display:none}
  .fc:not(.setup) .fc-setup{display:none}
  .fc-setup{flex:1;min-height:0;overflow:auto;padding:14px 2px 8px}
  .fc-setup h3{margin:0 0 14px;font-size:1.25rem}
  .fc-grp{margin:0 0 18px}
  .fc-gh{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.9rem}
  .fc-lnk{border:none;background:none;color:var(--accent);font:inherit;font-size:.85rem;cursor:pointer;padding:0;text-decoration:underline}
  .fc-chips{display:flex;flex-wrap:wrap;gap:8px}
  .fc-pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:.88rem;cursor:pointer}
  .fc-pill small{opacity:.65;margin-left:5px;font-size:.78rem}
  .fc-pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fc-count{margin:6px 0 12px;color:var(--muted);font-size:.95rem}
  .fc-start{width:100%;padding:14px;font-size:1.05rem}
  .fc-start:disabled{opacity:.45;cursor:default}
  .fc-play{flex:1;min-height:0;display:flex;flex-direction:column}
  .fc-bar{height:4px;background:var(--line);border-radius:4px;margin:10px 0 12px;overflow:hidden;flex:none}
  .fc-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  .fc-stage{flex:1;min-height:0;display:flex}
  .fc-card{flex:1;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;
    overflow:auto;display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
  .fc-meta{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-bottom:14px}
  .fc-meta .prob{margin:0}
  .fc-q{font-size:1.3rem;line-height:1.4;margin:0}
  .fc-a{display:none;margin-top:20px;padding-top:16px;border-top:1px dashed var(--accent);font-size:1.15rem;font-weight:600;color:var(--ans)}
  .fc-a .ctx{font-size:.9rem}
  .fc.flipped .fc-a{display:block}
  .fc-tap{margin-top:auto;padding-top:14px;color:var(--muted);font-size:.85rem;text-align:center}
  .fc.flipped .fc-tap{display:none}
  .fc-actions{display:flex;gap:10px;margin-top:12px;flex:none}
  .fc-actions button{padding:14px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1rem;cursor:pointer}
  .fc-actions .fc-nav{flex:0 0 54px;padding:14px 0}
  .fc-actions .fc-show{flex:1;border-color:var(--accent);color:var(--accent)}
  .fc-actions .fc-ok,.fc-actions .fc-no{flex:1;display:none;color:#fff}
  .fc-actions .fc-ok{background:#2e8b57;border-color:#2e8b57}
  .fc-actions .fc-no{background:#b5473a;border-color:#b5473a}
  .fc.flipped .fc-show{display:none}
  .fc.flipped .fc-ok,.fc.flipped .fc-no{display:block}
  .fc.done .fc-actions{display:none}
  .fc-hint{margin-top:8px;text-align:center;color:var(--muted);font-size:.75rem;flex:none}
  .fc-end{margin:auto;text-align:center}
  .fc-end h3{margin:0 0 6px;font-size:1.3rem}
  .fc-end p{margin:0 0 16px;color:var(--muted)}
  .fc-end .ctl{margin:4px}
  .fc-chip{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  button.ctl#fcOpen{background:#ff1493;border-color:#ff1493;color:#fff;font-weight:600}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><style>:root{--bg:#04060c;--card:rgba(255,255,255,.035);--ink:#e8edff;--muted:#8e97ba;--line:rgba(140,170,255,.14);
 --accent:#5ff5c8;--accent2:#8f7bff;--accent-soft:rgba(95,245,200,.1);--ans:#7dffd8}
@media (prefers-color-scheme: light){:root{--bg:#04060c;--card:rgba(255,255,255,.035);--ink:#e8edff;--muted:#8e97ba;--line:rgba(140,170,255,.14);--accent:#5ff5c8;--accent-soft:rgba(95,245,200,.1);--ans:#7dffd8}}
html{background:var(--bg)}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(143,123,255,.18),transparent 60%),radial-gradient(900px 500px at 50% 110%,rgba(95,245,200,.10),transparent 60%),var(--bg);
 color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;margin:0;display:flow-root}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,#gate{position:relative;z-index:1}
h1,h2{font-family:"Space Grotesk","Inter",sans-serif;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
section{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 20px 60px -30px rgba(0,0,0,.8);
 opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1),border-color .3s}
section.in{opacity:1;transform:none}
section:hover{border-color:rgba(95,245,200,.28)}
section h2{color:#fff}
.tag{background:linear-gradient(90deg,rgba(95,245,200,.15),rgba(143,123,255,.18));color:var(--accent);border:1px solid rgba(95,245,200,.25)}
.controls{background:linear-gradient(var(--bg),rgba(4,6,12,.85));backdrop-filter:blur(8px)}
button.ctl{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);transition:all .25s}
button.ctl:hover{border-color:var(--accent);box-shadow:0 0 18px -4px var(--accent)}
button.ctl.primary{background:linear-gradient(90deg,var(--accent),#6fd3ff);color:#03110c;border-color:transparent;font-weight:600;box-shadow:0 0 24px -6px var(--accent)}
li{border-color:var(--line)!important}
.reveal{border-color:rgba(95,245,200,.5);color:var(--accent);background:rgba(95,245,200,.05);transition:all .2s}
.reveal:hover{background:rgba(95,245,200,.14);box-shadow:0 0 16px -4px var(--accent)}
.ans{color:var(--ans);text-shadow:0 0 12px rgba(95,245,200,.35)}
li.open .ans{display:inline;animation:sweep .6s ease-out}
@keyframes sweep{from{clip-path:inset(0 100% 0 0);filter:blur(2px)}to{clip-path:inset(0 0 0 0);filter:none}}
.ctx{color:var(--muted)!important;text-shadow:none}
.mark button{background:rgba(255,255,255,.04);color:var(--ink);border-color:var(--line)}
.p3{background:rgba(255,92,122,.12);color:#ff8fa6;border:1px solid rgba(255,92,122,.3)}
.p2{background:rgba(255,200,90,.1);color:#ffd27a;border:1px solid rgba(255,200,90,.28)}
.p1{background:rgba(120,170,255,.1);color:#9cc0ff;border:1px solid rgba(120,170,255,.28)}
.picgrid li{background:rgba(255,255,255,.025);transition:transform .25s,box-shadow .25s}
.picgrid li:hover{transform:translateY(-3px);box-shadow:0 10px 30px -12px rgba(95,245,200,.4)}
.cat{color:var(--accent)}
.sources a{color:var(--accent)}
.score{color:var(--muted)}
/* beam hero */
.beam{position:relative;height:150px;margin:6px 0 10px;overflow:hidden;border-radius:18px;
 background:radial-gradient(60% 120% at 50% 50%,rgba(143,123,255,.16),transparent 70%)}
.beam .glow{position:absolute;left:50%;top:-20%;width:220px;height:140%;transform:translateX(-50%);
 background:radial-gradient(closest-side,rgba(95,245,200,.45),rgba(143,123,255,.25) 45%,transparent 75%);filter:blur(18px);animation:pulse 3.2s ease-in-out infinite}
.beam .line{position:absolute;left:50%;top:8%;bottom:8%;width:2px;transform:translateX(-50%);
 background:linear-gradient(transparent,#fff 20%,#bffff0 50%,#fff 80%,transparent);box-shadow:0 0 12px #9fffe6,0 0 32px var(--accent),0 0 70px var(--accent2)}
@keyframes pulse{0%,100%{opacity:.75;transform:translateX(-50%) scaleX(1)}50%{opacity:1;transform:translateX(-50%) scaleX(1.25)}}
.beam .half{position:absolute;inset:0}
.beam .half.l{clip-path:inset(0 50% 0 0)}.beam .half.r{clip-path:inset(0 0 0 50%)}
.beam .track{position:absolute;top:50%;margin-top:-.6em;line-height:1.2;white-space:nowrap;font-family:"Space Grotesk","Inter",sans-serif;font-weight:700;font-size:clamp(26px,6vw,46px);letter-spacing:.02em;
 animation:glide 9s linear infinite;will-change:transform}
.beam .half.cipher .track{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500;color:var(--accent);text-shadow:0 0 10px rgba(95,245,200,.6)}
.beam .half.plain .track{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.25)}
@keyframes glide{from{left:0;transform:translateX(-100%)}to{left:100%;transform:translateX(0)}}
.kicker{font-family:"JetBrains Mono",monospace;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.85}
/* gate */
#gate{max-width:440px;margin:10vh auto 0;padding:26px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(12px)}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-family:"JetBrains Mono",monospace;
 background:rgba(0,0,0,.35);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;letter-spacing:.15em;text-align:center}
#gate input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(95,245,200,.15),0 0 24px -6px var(--accent)}
#gate.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#gate.out{animation:gateout .7s forwards cubic-bezier(.6,0,.4,1)}
@keyframes gateout{to{opacity:0;transform:scale(.96);filter:blur(8px)}}
.flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(190,255,235,.9),rgba(95,245,200,.25) 30%,transparent 65%);animation:flash .9s forwards}
@keyframes flash{from{opacity:0;transform:scaleX(.02)}30%{opacity:1;transform:scaleX(1)}to{opacity:0;transform:scaleX(1.3)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}section{opacity:1;transform:none}}
/* unlock status log */
#log{display:none;text-align:left;margin-top:14px;padding:14px 16px;border-radius:14px;background:rgba(10,8,6,.75);border:1px solid rgba(255,140,60,.22);
 font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.78rem;color:#d9d2c8;box-shadow:0 0 40px -18px rgba(255,120,40,.5)}
#log.on{display:block;animation:logIn .35s ease-out}
@keyframes logIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#log .hd{font-family:"Inter",sans-serif;font-weight:600;color:#f2ede6;margin-bottom:8px}
#log .row{display:flex;align-items:center;gap:8px;margin:6px 0;opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .3s}
#log .row.show{opacity:1;transform:none}
#log .sub{padding-left:18px;color:#a79f95}
#log .sub::before{content:"↳";color:#6e655b;margin-right:4px}
#log .pill{white-space:nowrap;flex:none;background:rgba(255,120,40,.12);border:1px solid rgba(255,120,40,.3);color:#ffb27a;border-radius:7px;padding:1px 8px}
#log .arr{color:#6e655b}
#log .st{color:#a79f95;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log .arr{flex:none}
#log .ok .st{color:#7dffd8}
#log .bad .st,#log .bad .pill{color:#ff8fa6;border-color:rgba(255,92,122,.4);background:rgba(255,92,122,.1)}
#log .orange{color:#ff9a4d}
#log .dot{width:8px;height:8px;border-radius:50%;background:#ff8a3d;box-shadow:0 0 10px #ff8a3d;animation:blink 1s infinite}
#log .done .dot{background:var(--accent);box-shadow:0 0 10px var(--accent);animation:none}
@keyframes blink{50%{opacity:.35}}
#log .grid{display:inline-grid;grid-template-columns:repeat(3,4px);gap:2px}
#log .grid i{width:4px;height:4px;background:#ff8a3d;border-radius:1px;animation:gb 1s infinite}
#log .grid i:nth-child(2n){animation-delay:.2s}#log .grid i:nth-child(3n){animation-delay:.4s}
@keyframes gb{50%{opacity:.2}}
#log .spin::after{content:"";display:inline-block;width:1ch;animation:sp .8s steps(4) infinite}
@keyframes sp{0%{content:"⠋"}25%{content:"⠙"}50%{content:"⠸"}75%{content:"⠴"}}
/* orange protected-file gate */
body.locked{background:#0b0b0c}
#gate.hero{position:fixed;inset:10px;margin:0;max-width:none;padding:24px;border:none;border-radius:20px;backdrop-filter:none;
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
 background:radial-gradient(60% 45% at 50% 108%,#fff4c2 0%,#ffd27a 18%,rgba(255,150,60,.55) 38%,transparent 62%),
            radial-gradient(120% 90% at 50% 0%,#ff6a26 0%,#ff5a1f 55%,#f24e14 100%)}
#gate.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
 background-image:radial-gradient(rgba(255,255,255,.55) .7px,transparent .8px);background-size:5px 5px;
 -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.6) 60%,#000 100%);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.6) 60%,#000 100%)}
#gate.hero::after{content:"";position:absolute;left:50%;bottom:-18%;width:70%;height:40%;transform:translateX(-50%);
 background:radial-gradient(closest-side,rgba(255,250,220,.9),rgba(255,214,140,.5) 45%,transparent 75%);filter:blur(30px);animation:warm 6s ease-in-out infinite;pointer-events:none}
@keyframes warm{50%{opacity:.75;transform:translateX(-50%) scale(1.08)}}
#gate.hero>*{position:relative;z-index:1}
#gate.hero .kicker{color:rgba(255,255,255,.85);letter-spacing:.22em;font-size:.72rem;margin-bottom:22px}
#gate.hero h1{font-family:"Inter Tight","Inter",sans-serif;font-weight:400;letter-spacing:-.035em;line-height:1;color:#fff;
 font-size:clamp(44px,9vw,84px);margin:0 0 18px}
#gate.hero .lead{color:rgba(255,255,255,.92);font-size:1.05rem;margin:0 0 30px}
#gate.hero form{display:flex;gap:10px;width:100%;max-width:420px}
#gate.hero input{flex:1;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;
 padding:13px 18px;letter-spacing:.12em;text-align:left}
#gate.hero input::placeholder{color:rgba(255,255,255,.7)}
#gate.hero input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
#gate.hero button{width:auto!important;margin:0!important;border-radius:999px;background:#fffaf2;color:#1a1410;border:none;font-weight:500;
 padding:13px 24px!important;box-shadow:0 8px 24px -10px rgba(80,20,0,.5)}
#gate.hero button:hover{background:#fff;box-shadow:0 10px 30px -8px rgba(80,20,0,.6)}
#gate.hero #log{width:100%;max-width:420px;background:rgba(20,10,4,.72);border-color:rgba(255,255,255,.2)}
#gate.hero #err{color:#fff!important;opacity:.9}
@media (max-width:480px){#gate.hero form{flex-direction:column}}
/* calmer content page */
body:not(.locked){background:#0b0c10}
body:not(.locked) h1,body:not(.locked) h2{font-family:"Inter",sans-serif;letter-spacing:-.01em}
main{--accent:#8fb3a8;--ans:#d6e6e0;--accent-soft:rgba(143,179,168,.08)}
main section{opacity:1!important;transform:none!important;transition:border-color .2s!important;background:#111318;border-color:#1f232c;backdrop-filter:none;box-shadow:none}
main section:hover{border-color:#2a2f3a}
main .tag{background:rgba(255,255,255,.04);color:#9aa3b5;border:1px solid #2a2f3a}
main button.ctl{background:#151821;border-color:#262b36;color:#cfd5e2}

<script>const FX=(()=>{
  const G='0123456789ABCDEF#$%&@*+=<>/\\[]{}λΣΔΩψ';
  const rnd=n=>Array.from({length:n},()=>G[Math.random()*G.length|0]).join('');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function particles(){
    const c=document.getElementById('fx'); if(!c) return; const x=c.getContext('2d'); let W,H,P=[];
    const size=()=>{W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio};
    size(); addEventListener('resize',size);
    for(let i=0;i<110;i++) P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,v:Math.random()*.00025+.00005,t:Math.random()*6.28,h:Math.random()<.5?165:255});
    (function f(){x.clearRect(0,0,W,H);
      for(const p of P){p.y-=p.v; if(p.y<0){p.y=1;p.x=Math.random()} p.t+=.03;
        const a=.25+.35*Math.sin(p.t); const near=1-Math.min(1,Math.abs(p.x-.5)*2.2);
        x.beginPath(); x.arc(p.x*W,p.y*H,p.r*devicePixelRatio*(1+near),0,6.28);
        x.fillStyle=`hsla(${p.h},100%,75%,${Math.max(0,a+near*.3)})`; x.fill();}
      if(!reduce) requestAnimationFrame(f);})();
  }
  function beams(){
    document.querySelectorAll('.beam[data-text]:not(.ready)').forEach(b=>{
      b.classList.add('ready'); const t=b.dataset.text; const left=b.dataset.left||'plain';
      const right=left==='plain'?'cipher':'plain';
      b.innerHTML=`<div class="glow"></div><div class="half l ${left}"><div class="track"></div></div><div class="half r ${right}"><div class="track"></div></div><div class="line"></div>`;
      const [tl,tr]=b.querySelectorAll('.track');
      const set=()=>{const c=rnd(t.length); tl.textContent=left==='plain'?t:c; tr.textContent=right==='plain'?t:c;};
      set(); if(!reduce) setInterval(set,90);
    });
  }
  function reveal(){
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
    document.querySelectorAll('main section').forEach((s,i)=>{s.style.transitionDelay=Math.min(i,4)*60+'ms';io.observe(s)});
  }
  function scramble(el){
    const node=[...el.childNodes].find(n=>n.nodeType===3&&n.textContent.trim()); if(!node||reduce) return;
    const final=node.textContent; let f=0; const n=14;
    const iv=setInterval(()=>{f++; const k=Math.floor(final.length*f/n);
      node.textContent=final.slice(0,k)+rnd(Math.max(0,final.length-k)).replace(/./g,(ch,i)=>final[k+i]===' '?' ':ch);
      if(f>=n){clearInterval(iv);node.textContent=final}},28);
  }
  return {particles,beams,reveal};
})();
FX.beams();
