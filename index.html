      node.textContent=final.slice(0,k)+rnd(Math.max(0,final.length-k)).replace(/./g,(ch,i)=>final[k+i]===' '?' ':ch);

  }

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(p){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},key,u(D.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const kb=(D.ct.length*3/4/1024).toFixed(1);
function row(log,html,cls=''){const d=document.createElement('div');d.className='row '+cls;d.innerHTML=html;log.appendChild(d);requestAnimationFrame(()=>d.classList.add('show'));return d;}
const sub=(name,st)=>`<span class="pill">${name}</span><span class="arr">→</span><span class="st">${st}</span>`;
const GATE_HTML=document.getElementById('gate').outerHTML;
function lockPage(){ const m=document.querySelector('main'); if(!m) return; m.outerHTML=GATE_HTML; document.body.classList.add('locked'); scrollTo(0,0); bindGate(); document.getElementById('pw').focus(); }
function bindGate(){ document.getElementById('pf').addEventListener('submit',async e=>{
  e.preventDefault();
  const g=document.getElementById('gate'),f=document.getElementById('pf'),log=document.getElementById('log'),err=document.getElementById('err');
  err.textContent=''; f.style.display='none'; log.innerHTML=''; log.classList.add('on');
  row(log,'<span class="hd">Checking password…</span>');
  const head=row(log,'<span class="dot"></span><span class="orange">3 checks running</span>');
  await sleep(350);
  const r1=row(log,sub('derive-key','PBKDF2 · 250k')+'<span class="spin"></span>','sub');
  const job=unlock(document.getElementById('pw').value).then(d=>({d}),x=>({x}));
  await sleep(500);
  const r2=row(log,sub('decrypt','AES-256 · '+kb+' kB')+'<span class="spin"></span>','sub');
  const [res]=await Promise.all([job,sleep(700)]);
  r1.classList.add('ok'); r1.querySelector('.st').textContent='key ready'; r1.querySelector('.spin').remove();
  await sleep(250);
  if(res.x){
    r2.classList.add('bad'); r2.querySelector('.st').textContent='failed · wrong password'; r2.querySelector('.spin').remove();
    head.querySelector('.orange').textContent='access denied';
    await sleep(1100); log.classList.remove('on'); f.style.display='';
    err.textContent='> wrong password'; g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
    document.getElementById('pw').select(); return;
  }
  r2.classList.add('ok'); r2.querySelector('.st').textContent='decrypted · '+kb+' kB'; r2.querySelector('.spin').remove();
  await sleep(300);
  row(log,sub('integrity','verified ✓'),'sub ok');
  await sleep(350);
  head.classList.add('done'); head.querySelector('.orange').textContent='Password correct';
  head.querySelector('.orange').style.color='var(--accent)';
  await sleep(300);
  row(log,'<span class="grid">'+'<i></i>'.repeat(6)+'</span><span class="orange">Opening artefact now…</span>');
  await sleep(600);
  document.body.classList.remove('locked'); g.outerHTML=res.d.main;
  const s=document.createElement('script'); s.textContent='{'+res.d.js+'}'; document.body.appendChild(s);
  FX.beams(); FX.reveal(); scrollTo(0,0);
  const eb=document.getElementById('encryptBtn'); if(eb) eb.onclick=()=>{ eb.textContent='ENCRYPTING…'; eb.disabled=true; setTimeout(lockPage,400); };
  const t=()=>window.MathJax&&MathJax.typesetPromise?MathJax.typesetPromise():setTimeout(t,300); t();
}); }
bindGate();
</script></body></html>
