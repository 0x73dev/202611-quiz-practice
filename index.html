      b.classList.add('ready'); const t=b.dataset.text; const left=b.dataset.left||'plain';

      set(); if(!reduce) setInterval(set,90);

  function reveal(){

  }
  function scramble(el){

      node.textContent=final.slice(0,k)+rnd(Math.max(0,final.length-k)).replace(/./g,(ch,i)=>final[k+i]===' '?' ':ch);
      if(f>=n){clearInterval(iv);node.textContent=final}},28);
  }
