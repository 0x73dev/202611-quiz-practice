  @keyframes dnIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
  .dn-panel::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(rgba(255,255,255,.55) .7px,transparent .8px);background-size:5px 5px}

  .dn-panel>*{position:relative;z-index:1}

  .dn-kbox::before{content:"";position:absolute;inset:-4px;pointer-events:none;--c:#fff;--l:12px;--w:2px;background:
   linear-gradient(var(--c),var(--c)) top left/var(--l) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) top left/var(--w) var(--l) no-repeat,
   linear-gradient(var(--c),var(--c)) top right/var(--l) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) top right/var(--w) var(--l) no-repeat,
   linear-gradient(var(--c),var(--c)) bottom left/var(--l) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) bottom left/var(--w) var(--l) no-repeat,
   linear-gradient(var(--c),var(--c)) bottom right/var(--l) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) bottom right/var(--w) var(--l) no-repeat}
  .dn-title{font-family:"Inter Tight","Inter",sans-serif!important;font-weight:400;letter-spacing:-.035em;line-height:1;color:#fff;font-size:clamp(44px,9vw,84px);margin:0 0 18px}
  .dn-lead{color:rgba(255,255,255,.92);font-size:1.05rem;margin:0 0 30px}

html{background:var(--bg)}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(143,123,255,.18),transparent 60%),radial-gradient(900px 500px at 50% 110%,rgba(95,245,200,.10),transparent 60%),var(--bg);
 color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;margin:0;display:flow-root}

main,#gate{position:relative;z-index:1}

li{border-color:var(--line)!important}
.reveal{border-color:rgba(95,245,200,.5);color:var(--accent);background:rgba(95,245,200,.05);transition:all .2s}
.reveal:hover{background:rgba(95,245,200,.14);box-shadow:0 0 16px -4px var(--accent)}

li.open .ans{display:inline;animation:sweep .6s ease-out}

.ctx{color:var(--muted)!important;text-shadow:none}

/* beam hero */
.beam{position:relative;height:150px;margin:6px 0 10px;overflow:hidden;border-radius:18px;
 background:radial-gradient(60% 120% at 50% 50%,rgba(143,123,255,.16),transparent 70%)}
.beam .glow{position:absolute;left:50%;top:-20%;width:220px;height:140%;transform:translateX(-50%);
 background:radial-gradient(closest-side,rgba(95,245,200,.45),rgba(143,123,255,.25) 45%,transparent 75%);filter:blur(18px);animation:pulse 3.2s ease-in-out infinite}
.beam .line{position:absolute;left:50%;top:8%;bottom:8%;width:2px;transform:translateX(-50%);
 background:linear-gradient(transparent,#fff 20%,#bffff0 50%,#fff 80%,transparent);box-shadow:0 0 12px #9fffe6,0 0 32px var(--accent),0 0 70px var(--accent2)}
@keyframes pulse{0%,100%{opacity:.75;transform:translateX(-50%) scaleX(1)}50%{opacity:1;transform:translateX(-50%) scaleX(1.25)}}
.beam .half{position:absolute;inset:0}
.beam .half.l{clip-path:inset(0 50% 0 0)}.beam .half.r{clip-path:inset(0 0 0 50%)}
.beam .track{position:absolute;top:50%;margin-top:-.6em;line-height:1.2;white-space:nowrap;font-family:"Space Grotesk","Inter",sans-serif;font-weight:700;font-size:clamp(26px,6vw,46px);letter-spacing:.02em;
 animation:glide 9s linear infinite;will-change:transform}
.beam .half.cipher .track{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500;color:var(--accent);text-shadow:0 0 10px rgba(95,245,200,.6)}
.beam .half.plain .track{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.25)}
@keyframes glide{from{left:0;transform:translateX(-100%)}to{left:100%;transform:translateX(0)}}
.kicker{font-family:"JetBrains Mono",monospace;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.85}
/* gate */
#gate{max-width:440px;margin:10vh auto 0;padding:26px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(12px)}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-family:"JetBrains Mono",monospace;
 background:rgba(0,0,0,.35);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;letter-spacing:.15em;text-align:center}
#gate input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(95,245,200,.15),0 0 24px -6px var(--accent)}
#gate.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#gate.out{animation:gateout .7s forwards cubic-bezier(.6,0,.4,1)}
@keyframes gateout{to{opacity:0;transform:scale(.96);filter:blur(8px)}}
.flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(190,255,235,.9),rgba(95,245,200,.25) 30%,transparent 65%);animation:flash .9s forwards}
@keyframes flash{from{opacity:0;transform:scaleX(.02)}30%{opacity:1;transform:scaleX(1)}to{opacity:0;transform:scaleX(1.3)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}section{opacity:1;transform:none}}
/* unlock status log */
#log{display:none;text-align:left;margin-top:14px;padding:14px 16px;border-radius:14px;background:rgba(10,8,6,.75);border:1px solid rgba(255,140,60,.22);
 font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.78rem;color:#d9d2c8;box-shadow:0 0 40px -18px rgba(255,120,40,.5)}
#log.on{display:block;animation:logIn .35s ease-out}
@keyframes logIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#log .hd{font-family:"Inter",sans-serif;font-weight:600;color:#f2ede6;margin-bottom:8px}

#log .row.show{opacity:1;transform:none}

#log .orange{color:#ff9a4d}
#log .dot{width:8px;height:8px;border-radius:50%;background:#ff8a3d;box-shadow:0 0 10px #ff8a3d;animation:blink 1s infinite}
#log .done .dot{background:var(--accent);box-shadow:0 0 10px var(--accent);animation:none}
@keyframes blink{50%{opacity:.35}}
#log .grid{display:inline-grid;grid-template-columns:repeat(3,4px);gap:2px}
#log .grid i{width:4px;height:4px;background:#ff8a3d;border-radius:1px;animation:gb 1s infinite}
#log .grid i:nth-child(2n){animation-delay:.2s}#log .grid i:nth-child(3n){animation-delay:.4s}
@keyframes gb{50%{opacity:.2}}

@keyframes sp{0%{content:"⠋"}25%{content:"⠙"}50%{content:"⠸"}75%{content:"⠴"}}

<div class="kicker kbox">Encrypted · AES-256</div>
<h1>Protected File</h1>
<p class="lead">Enter the password to decrypt.</p>
<form id="pf"><input id="pw" type="password" autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" spellcheck="false" placeholder="Password">
<button class="ctl primary" type="submit">Decrypt</button></form>

<p id="err" class="mono" style="color:#ff8fa6;font-size:.85rem;min-height:1.2em;margin:10px 0 0"></p></div>
<script>const FX=(()=>{
  const G='0123456789ABCDEF#$%&@*+=<>/\\[]{}λΣΔΩψ';
  const rnd=n=>Array.from({length:n},()=>G[Math.random()*G.length|0]).join('');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function particles(){
    const c=document.getElementById('fx'); if(!c) return; const x=c.getContext('2d'); let W,H,P=[];
    const size=()=>{W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio};
    size(); addEventListener('resize',size);
    for(let i=0;i<110;i++) P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,v:Math.random()*.00025+.00005,t:Math.random()*6.28,h:Math.random()<.5?165:255});
    (function f(){x.clearRect(0,0,W,H);
      for(const p of P){p.y-=p.v; if(p.y<0){p.y=1;p.x=Math.random()} p.t+=.03;
        const a=.25+.35*Math.sin(p.t); const near=1-Math.min(1,Math.abs(p.x-.5)*2.2);
        x.beginPath(); x.arc(p.x*W,p.y*H,p.r*devicePixelRatio*(1+near),0,6.28);
        x.fillStyle=`hsla(${p.h},100%,75%,${Math.max(0,a+near*.3)})`; x.fill();}
      if(!reduce) requestAnimationFrame(f);})();
  }
  function beams(){
    document.querySelectorAll('.beam[data-text]:not(.ready)').forEach(b=>{
      b.classList.add('ready'); const t=b.dataset.text; const left=b.dataset.left||'plain';
      const right=left==='plain'?'cipher':'plain';
      b.innerHTML=`<div class="glow"></div><div class="half l ${left}"><div class="track"></div></div><div class="half r ${right}"><div class="track"></div></div><div class="line"></div>`;
      const [tl,tr]=b.querySelectorAll('.track');
      const set=()=>{const c=rnd(t.length); tl.textContent=left==='plain'?t:c; tr.textContent=right==='plain'?t:c;};
      set(); if(!reduce) setInterval(set,90);
    });
  }
  function reveal(){
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
    document.querySelectorAll('main section').forEach((s,i)=>{s.style.transitionDelay=Math.min(i,4)*60+'ms';io.observe(s)});
  }
  function scramble(el){
    const node=[...el.childNodes].find(n=>n.nodeType===3&&n.textContent.trim()); if(!node||reduce) return;
    const final=node.textContent; let f=0; const n=14;
    const iv=setInterval(()=>{f++; const k=Math.floor(final.length*f/n);
      node.textContent=final.slice(0,k)+rnd(Math.max(0,final.length-k)).replace(/./g,(ch,i)=>final[k+i]===' '?' ':ch);
      if(f>=n){clearInterval(iv);node.textContent=final}},28);
  }
  return {particles,beams,reveal};
})();
FX.beams();

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(p){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},key,u(D.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const kb=(D.ct.length*3/4/1024).toFixed(1);
function row(log,html,cls=''){const d=document.createElement('div');d.className='row '+cls;d.innerHTML=html;log.appendChild(d);requestAnimationFrame(()=>d.classList.add('show'));return d;}
const sub=(name,st)=>`<span class="pill">${name}</span><span class="arr">→</span><span class="st">${st}</span>`;
const GATE_HTML=document.getElementById('gate').outerHTML;
function lockPage(){ const m=document.querySelector('main'); if(!m) return; m.outerHTML=GATE_HTML; document.body.classList.add('locked'); scrollTo(0,0); bindGate(); document.getElementById('pw').focus(); }
function bindGate(){ document.getElementById('pf').addEventListener('submit',async e=>{
  e.preventDefault();
  const g=document.getElementById('gate'),f=document.getElementById('pf'),log=document.getElementById('log'),err=document.getElementById('err');
  err.textContent=''; f.style.display='none'; log.innerHTML=''; log.classList.add('on');
  row(log,'<span class="hd">Checking password…</span>');
  const head=row(log,'<span class="dot"></span><span class="orange">3 checks running</span>');
  await sleep(350);
  const r1=row(log,sub('derive-key','PBKDF2 · 250k')+'<span class="spin"></span>','sub');
  const job=unlock(document.getElementById('pw').value).then(d=>({d}),x=>({x}));
  await sleep(500);
  const r2=row(log,sub('decrypt','AES-256 · '+kb+' kB')+'<span class="spin"></span>','sub');
  const [res]=await Promise.all([job,sleep(700)]);
  r1.classList.add('ok'); r1.querySelector('.st').textContent='key ready'; r1.querySelector('.spin').remove();
  await sleep(250);
  if(res.x){
    r2.classList.add('bad'); r2.querySelector('.st').textContent='failed · wrong password'; r2.querySelector('.spin').remove();
    head.querySelector('.orange').textContent='access denied';
    await sleep(1100); log.classList.remove('on'); f.style.display='';
    err.textContent='> wrong password'; g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
    document.getElementById('pw').select(); return;
  }
  r2.classList.add('ok'); r2.querySelector('.st').textContent='decrypted · '+kb+' kB'; r2.querySelector('.spin').remove();
  await sleep(300);
  row(log,sub('integrity','verified ✓'),'sub ok');
  await sleep(350);
  head.classList.add('done'); head.querySelector('.orange').textContent='Password correct';
  head.querySelector('.orange').style.color='var(--accent)';
  await sleep(300);
  row(log,'<span class="grid">'+'<i></i>'.repeat(6)+'</span><span class="orange">Opening artefact now…</span>');
  await sleep(600);
  document.body.classList.remove('locked'); g.outerHTML=res.d.main;
  const s=document.createElement('script'); s.textContent='{'+res.d.js+'}'; document.body.appendChild(s);
  FX.beams(); FX.reveal(); scrollTo(0,0);
  const eb=document.getElementById('encryptBtn'); if(eb) eb.onclick=()=>{ eb.textContent='ENCRYPTING…'; eb.disabled=true; setTimeout(lockPage,400); };
  const t=()=>window.MathJax&&MathJax.typesetPromise?MathJax.typesetPromise():setTimeout(t,300); t();
}); }
bindGate();
</script></body></html>
